<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeongsan</title>
  <style>
    :root {
      --bg: #f5f7f6; --card: #ffffff; --ink: #18211d; --muted: #63706a; --line: #dfe5e2;
      --accent: #1f7a55; --accent-ink: #ffffff; --soft: #e3f1ea;
      --warn-bg: #fff4ce; --warn-ink: #8a5a00; --bad: #c92a2a; --chip: #eef1f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101513; --card: #18201c; --ink: #e6ede9; --muted: #95a39c; --line: #2a3530;
        --accent: #4cc38a; --accent-ink: #07130d; --soft: #1d3a2c;
        --warn-bg: #3a3014; --warn-ink: #ffd27a; --bad: #ff8787; --chip: #24302a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); word-break: keep-all; overflow-wrap: anywhere;
           font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { max-width: 1080px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 0 12px; }
    h1 { font-size: 1.6rem; margin: 6px 0 0; }
    .tagline { color: var(--muted); margin: 2px 0 18px; }
    .lang { display: flex; gap: 4px; margin-top: 8px; }
    .lang button { padding: 4px 10px; font-size: .85rem; white-space: nowrap; }
    .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
             color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 26px 16px; text-align: center; transition: .15s; }
    #drop.over { border-color: var(--accent); background: var(--soft); }
    #drop strong { display: block; font-size: 1.1rem; }
    #drop p { margin: 4px 0 14px; color: var(--muted); }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .progress { margin-top: 14px; }
    .bar { height: 8px; background: var(--soft); border-radius: 999px; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .hint { color: var(--muted); font-size: .88rem; margin: 6px 0 0; }
    .error { color: var(--bad); }
    .totals { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
    .totals strong { font-size: 2rem; letter-spacing: -.01em; }
    .totals .other { font-size: 1.2rem; color: var(--muted); }
    .stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
    .stats li { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .9rem; }
    .stats li.warn { background: var(--warn-bg); color: var(--warn-ink); font-weight: 600; }
    .downloads { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .downloads .spacer { flex: 1; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: .8rem; color: var(--muted); font-weight: 600; padding: 0 6px 6px; }
    td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
    tr.look td { background: var(--warn-bg); }
    input, select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
                    background: var(--card); color: var(--ink); font: inherit; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    input.sub { margin-top: 4px; font-size: .85rem; color: var(--muted); padding: 3px 8px; }
    input.amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .money { display: flex; gap: 4px; }
    input.currency { width: 4.6em; flex: none; padding: 6px; text-align: center; text-transform: uppercase; }
    .thumb { width: 46px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line);
             cursor: zoom-in; background: var(--chip); display: grid; place-items: center; font-size: .7rem; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { background: var(--card); border: 1px solid var(--warn-ink); color: var(--warn-ink); border-radius: 12px;
            padding: 2px 8px; font-size: .78rem; }
    .ok { color: var(--accent); font-weight: 600; font-size: .85rem; }
    label.check { display: flex; gap: 6px; align-items: center; font-size: .85rem; margin-top: 6px; cursor: pointer; }
    label.check input { width: auto; }
    .remove { padding: 2px 8px; color: var(--muted); }
    .col-date { width: 118px; } .col-cat { width: 120px; } .col-pay { width: 92px; } .col-amt { width: 170px; }
    .col-check { width: 190px; }
    #excluded li { margin: 4px 0; }
    #excluded button { padding: 2px 8px; font-size: .8rem; margin-left: 6px; }
    footer { color: var(--muted); font-size: .85rem; text-align: center; margin: 8px 0 24px; }
    dialog { border: 0; border-radius: 14px; padding: 12px; background: var(--card); color: var(--ink); max-width: 92vw; }
    dialog img { max-width: 86vw; max-height: 80vh; display: block; border-radius: 8px; }
    dialog::backdrop { background: rgb(0 0 0 / .55); }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 6px;
           grid-template-columns: 52px .8fr 1.2fr 34px;
           grid-template-areas: "thumb merchant merchant remove" "thumb date amount amount" "cat cat pay pay" "check check check check"; }
      td { border: 0; padding: 0; }
      td.cell-thumb { grid-area: thumb; } td.cell-merchant { grid-area: merchant; } td.cell-date { grid-area: date; }
      td.cell-amt { grid-area: amount; } td.cell-cat { grid-area: cat; } td.cell-pay { grid-area: pay; }
      td.cell-check { grid-area: check; } td.cell-remove { grid-area: remove; }
      tr.look { background: var(--warn-bg); border-radius: 10px; padding: 8px; }
      tr.look td { background: none; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>🧾 <span data-t="title"></span></h1>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </header>

  <section class="card">
    <div id="drop">
      <strong data-t="dropTitle"></strong>
      <p data-t="dropHint"></p>
      <div class="buttons">
        <button id="pick" class="primary" type="button" data-t="pick"></button>
        <button id="sample" type="button" data-t="sample"></button>
      </div>
      <input id="files" type="file" accept="image/*,.heic,.heif" multiple hidden>
    </div>
    <div id="progress" class="progress" hidden>
      <div class="bar"><span id="bar"></span></div>
      <p id="progress-text" class="hint"></p>
    </div>
    <p id="error" class="error" hidden></p>
    <ul id="file-errors" class="hint error"></ul>
  </section>

  <section id="summary" class="card" hidden>
    <div class="totals" id="totals"></div>
    <ul class="stats" id="stats"></ul>
    <p id="look-hint" class="hint" hidden></p>
    <div class="downloads">
      <button id="xlsx" class="primary" type="button" data-t="xlsx"></button>
      <button id="csv" type="button" data-t="csv"></button>
      <span class="spacer"></span>
      <button id="clear" type="button" data-t="clear"></button>
    </div>
  </section>

  <section id="table-card" class="card" hidden>
    <table>
      <thead>
        <tr>
          <th></th>
          <th class="col-date" data-t="colDate"></th>
          <th data-t="colMerchant"></th>
          <th class="col-cat" data-t="colCategory"></th>
          <th class="col-pay" data-t="colPayment"></th>
          <th class="col-amt" data-t="colAmount"></th>
          <th class="col-check" data-t="colCheck"></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section id="excluded-card" class="card" hidden>
    <strong data-t="excluded"></strong>
    <ul id="excluded"></ul>
  </section>

  <footer id="footer"></footer>
</main>

<dialog id="preview"><img alt=""><p class="hint" id="preview-name"></p></dialog>

<datalist id="currencies">
  <option value="KRW"><option value="USD"><option value="JPY"><option value="EUR"><option value="CNY"><option value="VND">
</datalist>

<script>
  // Model output is untrusted text: it only ever goes into textContent or input values, never innerHTML.
  const $ = (id) => document.getElementById(id);
  const T = {
    ko: {
      title: "정산 Jeongsan",
      tagline: "영수증 사진을 몰아서 올리면, 이 컴퓨터의 오픈 모델이 경비 정산서를 만들어요.",
      dropTitle: "영수증 사진을 여기에 끌어다 놓으세요",
      dropHint: "JPEG, PNG, HEIC · 한 달 치를 한 번에 올려도 돼요",
      pick: "사진 고르기", sample: "샘플 영수증으로 해보기",
      reading: (n, total, avg, left) => `${n}/${total}장 읽는 중` + (avg ? ` · 장당 ${avg}초 · 남은 시간 약 ${left}` : ""),
      done: (total, secs) => `${total}장 다 읽었어요 · 모델 시간 ${secs}`,
      modelDown: "모델이 응답하지 않아요. Ollama가 켜져 있고 모델을 받아 뒀는지 확인해 주세요.",
      retry: "다시 시도",
      receipts: (n) => `영수증 ${n}장`, look: (n) => `확인 필요 ${n}건`, excludedN: (n) => `제외 ${n}장`,
      modelTime: (t) => `모델 시간 ${t}`,
      lookHint: "노란 줄만 보시면 돼요. 사진을 누르면 크게 보여요.",
      dupHint: "같은 영수증을 두 번 찍은 줄은 ×로 지우세요.",
      allClear: "확인이 필요한 줄이 없어요.",
      xlsx: "엑셀로 받기", csv: "CSV", clear: "모두 지우기",
      colDate: "날짜", colMerchant: "사용처 · 내용 · 사업자번호", colCategory: "분류", colPayment: "결제",
      colAmount: "금액", colCheck: "확인",
      phDate: "YYYY-MM-DD", phTime: "시간", phMerchant: "사용처", phSummary: "내용", phBiz: "사업자번호",
      checked: "확인함", fine: "✓ 검사 통과", remove: "줄 지우기",
      excluded: "정산에서 뺀 사진", isReceipt: "영수증 맞아요",
      footer: (model) => `🔒 사진은 이 컴퓨터의 Ollama(${model})로만 가고, 어디에도 저장되지 않아요.`,
      seconds: (s) => s < 60 ? `${Math.round(s)}초` : `${Math.floor(s / 60)}분 ${Math.round(s % 60)}초`,
    },
    en: {
      title: "Jeongsan",
      tagline: "Drop a month of receipt photos. An open model on this computer writes the expense report.",
      dropTitle: "Drop receipt photos here",
      dropHint: "JPEG, PNG, HEIC · a whole month at once is fine",
      pick: "Choose photos", sample: "Try the sample receipts",
      reading: (n, total, avg, left) => `Reading ${n} of ${total}` + (avg ? ` · ${avg} s each · about ${left} left` : ""),
      done: (total, secs) => `Read all ${total} · model time ${secs}`,
      modelDown: "The model did not answer. Is Ollama running with the model pulled?",
      retry: "Try again",
      receipts: (n) => (n === 1 ? "1 receipt" : `${n} receipts`), look: (n) => `${n} to check`,
      excludedN: (n) => `${n} left out`,
      modelTime: (t) => `model time ${t}`,
      lookHint: "Only the yellow rows need you. Click a photo to see it large.",
      dupHint: "If two rows are the same receipt, remove one with ×.",
      allClear: "Nothing needs a look.",
      xlsx: "Download Excel", csv: "CSV", clear: "Start over",
      colDate: "Date", colMerchant: "Merchant · description · business no.", colCategory: "Category",
      colPayment: "Payment", colAmount: "Amount", colCheck: "Check",
      phDate: "YYYY-MM-DD", phTime: "time", phMerchant: "merchant", phSummary: "description", phBiz: "business no.",
      checked: "Checked", fine: "✓ Checks passed", remove: "Remove row",
      excluded: "Photos left out of the report", isReceipt: "It is a receipt",
      footer: (model) => `🔒 Photos only go to Ollama (${model}) on this computer and are never saved.`,
      seconds: (s) => s < 60 ? `${Math.round(s)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`,
    },
  };
  const LOOK = new Set([
    "unreadable", "no_total", "bad_date", "sum_mismatch", "bad_business_number", "no_business_number", "possible_duplicate",
  ]);
  const LEFT_OUT = new Set(["not_receipt", "duplicate_photo"]);
  const EDITED_CLEARS = { merchant: "merchant", business_number: "business_number", date: "date", time: "time", total: "total" };

  let lang = localStorage.getItem("jeongsan-lang") || (navigator.language.startsWith("ko") ? "ko" : "en");
  let labels = null, model = "", items = [], summary = null, nextKey = 1, seq = 0;
  const queue = [];
  let busy = false, done = 0, queued = 0, generation = 0;
  const t = () => T[lang];

  function fmtMoney(amount, currency) {
    if (amount === null || amount === undefined) return "–";
    try {
      return new Intl.NumberFormat(lang === "ko" ? "ko-KR" : "en-US", { style: "currency", currency }).format(amount);
    } catch { return `${amount} ${currency}`; }
  }

  function plainNumber(amount, currency) {
    const places = ["KRW", "JPY", "VND"].includes(currency) ? 0 : 2;
    return new Intl.NumberFormat("en-US", { minimumFractionDigits: places, maximumFractionDigits: places }).format(amount);
  }

  function flagText(row, flag) {
    const fields = row.unreadable.map((f) => labels[lang].fields[f]).join(", ");
    // A sum mismatch shows its arithmetic, so the person knows which numbers to compare with the photo.
    const lines = row.breakdown.map((line, i) => (i === 0 ? (line.amount < 0 ? "-" : "") : line.amount < 0 ? " - " : " + ")
      + plainNumber(Math.abs(line.amount), row.currency)).join("");
    const added = row.breakdown.reduce((sum, line) => sum + line.amount, 0);
    const total = row.total === null ? "?" : plainNumber(row.total, row.currency);
    return labels[lang].flags[flag].replace("{fields}", fields).replace("{lines}", lines)
      .replace("{sum}", plainNumber(added, row.currency)).replace("{total}", total);
  }

  const leftOut = (row) => row.flags.some((f) => LEFT_OUT.has(f));
  const needsLook = (row) => !leftOut(row) && !row.reviewed && row.flags.some((f) => LOOK.has(f));

  // ---------- reading photos ----------

  function enqueue(files) {
    for (const file of files) queue.push(file);
    queued += files.length;
    $("error").hidden = true;
    pump();
  }

  async function pump() {
    if (busy) return;
    busy = true;
    while (queue.length) {
      showProgress();
      const file = queue[0], round = generation;
      const form = new FormData();
      form.append("photo", file, file.name);
      let resp;
      try {
        resp = await fetch("/api/receipts", { method: "POST", body: form });
      } catch { resp = null; }
      if (round !== generation) continue;  // "start over" was pressed while this photo was being read
      if (!resp || resp.status === 502) {
        showModelDown();
        busy = false;
        return;
      }
      queue.shift();
      done += 1;
      if (resp.ok) {
        items.push({ key: nextKey++, row: await resp.json(), thumb: URL.createObjectURL(file) });
        await refresh();
      } else {
        const detail = (await resp.json().catch(() => ({}))).detail || resp.statusText;
        const li = document.createElement("li");
        li.textContent = `${file.name}: ${detail}`;
        $("file-errors").append(li);
      }
    }
    busy = false;
    showProgress();
  }

  function showProgress() {
    const total = queued;
    if (!total) { $("progress").hidden = true; return; }
    $("progress").hidden = false;
    $("bar").style.width = `${Math.round((done / total) * 100)}%`;
    const timed = items.filter((i) => i.row.seconds > 0);
    const spent = timed.reduce((s, i) => s + i.row.seconds, 0);
    const avg = timed.length ? spent / timed.length : 0;
    $("progress-text").textContent = done >= total
      ? t().done(total, t().seconds(summary ? summary.model_seconds : spent))
      : t().reading(done + 1, total, avg ? avg.toFixed(1) : "", t().seconds(avg * (total - done)));
  }

  function showModelDown() {
    const error = $("error");
    error.textContent = t().modelDown + " ";
    const retry = document.createElement("button");
    retry.type = "button";
    retry.textContent = t().retry;
    retry.onclick = () => { error.hidden = true; pump(); };
    error.append(retry);
    error.hidden = false;
  }

  // ---------- report ----------

  async function refresh() {
    const mine = ++seq;
    const resp = await fetch("/api/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rows: items.map((i) => i.row) }),
    });
    if (!resp.ok || mine !== seq) return;  // a newer refresh is on its way
    const report = await resp.json();
    report.rows.forEach((row, n) => { if (items[n]) items[n].row = row; });
    summary = report.summary;
    render();
  }

  function commitTyping() {
    // An upload can finish while someone is typing: keep what they typed before redrawing.
    const el = document.activeElement;
    if (el && el.tagName === "INPUT" && el.type !== "checkbox" && el.dataset.field) {
      setField(el.closest("tr").dataset.key, el.dataset.field, el.value);
    }
  }

  function setField(key, field, value) {
    const item = items.find((i) => String(i.key) === String(key));
    if (!item) return;
    if (field === "total") {
      const number = parseFloat(String(value).replace(/[^\d.-]/g, ""));
      value = Number.isFinite(number) ? number : null;
    }
    if (field === "reviewed") value = Boolean(value);
    item.row[field] = value;
    if (EDITED_CLEARS[field]) item.row.unreadable = item.row.unreadable.filter((f) => f !== EDITED_CLEARS[field]);
  }

  function render() {
    commitTyping();
    const active = document.activeElement;
    const focus = active && active.dataset && active.dataset.field
      ? { key: active.closest("tr").dataset.key, field: active.dataset.field, pos: active.selectionStart }
      : null;

    renderSummary();
    const body = $("rows");
    body.replaceChildren(...items.filter((i) => !leftOut(i.row)).map(renderRow));
    $("table-card").hidden = !body.children.length;
    renderExcluded();

    if (focus) {
      const el = body.querySelector(`tr[data-key="${focus.key}"] [data-field="${focus.field}"]`);
      if (el) { el.focus(); try { el.setSelectionRange(focus.pos, focus.pos); } catch {} }
    }
  }

  function renderSummary() {
    const card = $("summary");
    card.hidden = !items.length;
    if (!summary) return;
    const totals = Object.entries(summary.totals);
    $("totals").replaceChildren(...totals.map(([code, total], n) => {
      const el = document.createElement(n ? "span" : "strong");
      if (n) el.className = "other";
      el.textContent = (n ? "+ " : "") + fmtMoney(total.total, code);
      return el;
    }));
    const stats = [[t().receipts(summary.count), ""]];
    if (summary.needs_review) stats.push([t().look(summary.needs_review), "warn"]);
    if (summary.excluded) stats.push([t().excludedN(summary.excluded), ""]);
    stats.push([t().modelTime(t().seconds(summary.model_seconds)), ""]);
    $("stats").replaceChildren(...stats.map(([text, cls]) => {
      const li = document.createElement("li");
      li.textContent = text;
      li.className = cls;
      return li;
    }));
    const hint = $("look-hint");
    hint.hidden = !summary.count;
    hint.textContent = summary.needs_review ? t().lookHint : t().allClear;
    if (items.some((i) => needsLook(i.row) && i.row.flags.includes("possible_duplicate"))) hint.textContent += " " + t().dupHint;
    $("xlsx").disabled = $("csv").disabled = !summary.count;
  }

  function input(row, field, cls, placeholder) {
    const el = document.createElement("input");
    el.type = "text";
    el.className = cls;
    el.dataset.field = field;
    el.placeholder = placeholder;
    el.setAttribute("aria-label", placeholder);
    el.value = row[field] ?? "";
    return el;
  }

  function amountInput(row) {
    const el = input(row, "total", "amount", "0");
    el.inputMode = "decimal";
    if (row.total !== null) el.value = plainNumber(row.total, row.currency);
    return el;
  }

  function moneyCell(row) {
    const box = document.createElement("div");
    box.className = "money";
    const currency = input(row, "currency", "currency", "KRW");
    currency.setAttribute("list", "currencies");
    box.append(currency, amountInput(row));
    return box;
  }

  function select(row, field, options, name) {
    const el = document.createElement("select");
    el.dataset.field = field;
    el.setAttribute("aria-label", name);
    for (const [value, text] of Object.entries(options)) el.append(new Option(text, value, false, row[field] === value));
    return el;
  }

  function cell(cls, ...children) {
    const td = document.createElement("td");
    td.className = cls;
    td.append(...children);
    return td;
  }

  function renderRow(item) {
    const { row } = item;
    const tr = document.createElement("tr");
    tr.dataset.key = item.key;
    if (needsLook(row)) tr.className = "look";

    const img = document.createElement("img");
    img.className = "thumb";
    img.alt = row.file_name;
    img.src = item.thumb;
    img.onerror = () => img.replaceWith(Object.assign(document.createElement("div"), { className: "thumb", textContent: "HEIC" }));
    img.onclick = () => openPreview(item);

    const check = document.createElement("div");
    const flags = row.flags.filter((f) => LOOK.has(f));
    if (flags.length) {
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const flag of flags) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = flagText(row, flag);
        chips.append(chip);
      }
      const label = document.createElement("label");
      label.className = "check";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.dataset.field = "reviewed";
      box.checked = row.reviewed;
      label.append(box, t().checked);
      if (!row.reviewed) check.append(chips);
      check.append(label);
    } else {
      check.append(Object.assign(document.createElement("span"), { className: "ok", textContent: t().fine }));
    }

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "remove";
    remove.textContent = "×";
    remove.title = t().remove;
    remove.setAttribute("aria-label", t().remove);
    remove.onclick = () => { items = items.filter((i) => i !== item); refresh(); render(); };

    tr.append(
      cell("cell-thumb", img),
      cell("cell-date", input(row, "date", "", t().phDate), input(row, "time", "sub", t().phTime)),
      cell("cell-merchant", input(row, "merchant", "", t().phMerchant), input(row, "summary", "sub", t().phSummary),
           input(row, "business_number", "sub", t().phBiz)),
      cell("cell-cat", select(row, "category", labels[lang].categories, t().colCategory)),
      cell("cell-pay", select(row, "payment", labels[lang].payments, t().colPayment)),
      cell("cell-amt", moneyCell(row)),
      cell("cell-check", check),
      cell("cell-remove", remove),
    );
    tr.addEventListener("change", (event) => {
      const el = event.target;
      if (!el.dataset.field) return;
      setField(item.key, el.dataset.field, el.type === "checkbox" ? el.checked : el.value);
      refresh();
    });
    return tr;
  }

  function renderExcluded() {
    const out = items.filter((i) => leftOut(i.row));
    $("excluded-card").hidden = !out.length;
    $("excluded").replaceChildren(...out.map((item) => {
      const li = document.createElement("li");
      li.textContent = `${item.row.file_name}: ${item.row.flags.map((f) => flagText(item.row, f)).join(", ")}`;
      if (item.row.flags.includes("not_receipt")) {
        const yes = document.createElement("button");
        yes.type = "button";
        yes.textContent = t().isReceipt;
        // The model said no; the person says yes. The row comes back empty and flagged, ready to fill in.
        yes.onclick = () => { item.row.is_receipt = true; item.row.unreadable = ["merchant", "date", "total"]; refresh(); };
        li.append(yes);
      }
      return li;
    }));
  }

  function openPreview(item) {
    const dialog = $("preview");
    dialog.querySelector("img").src = item.thumb;
    $("preview-name").textContent = item.row.file_name;
    dialog.showModal();
  }
  $("preview").onclick = () => $("preview").close();

  async function download(kind) {
    commitTyping();
    const resp = await fetch(`/api/report.${kind}?lang=${lang}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rows: items.map((i) => i.row) }),
    });
    if (!resp.ok) return;
    const name = /filename="([^"]+)"/.exec(resp.headers.get("Content-Disposition") || "")?.[1] || `jeongsan.${kind}`;
    const link = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await resp.blob()), download: name });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
  }

  // ---------- wiring ----------

  function applyLang() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll("[data-t]")) el.textContent = t()[el.dataset.t];
    for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    $("footer").textContent = t().footer(model || "…");
    if (labels) render();
    if (queued) showProgress();
  }

  for (const b of document.querySelectorAll("[data-lang]")) {
    b.onclick = () => {
      lang = b.dataset.lang;
      try { localStorage.setItem("jeongsan-lang", lang); } catch {}
      applyLang();
    };
  }
  $("pick").onclick = () => $("files").click();
  $("files").onchange = (e) => { enqueue([...e.target.files]); e.target.value = ""; };
  $("sample").onclick = async () => {
    const { photos } = await (await fetch("/api/samples")).json();
    const files = await Promise.all(photos.map(async (name) => {
      const blob = await (await fetch(`/samples/${encodeURIComponent(name)}`)).blob();
      return new File([blob], name, { type: blob.type });
    }));
    enqueue(files);
  };
  const drop = $("drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    enqueue([...e.dataTransfer.files]);
  });
  $("xlsx").onclick = () => download("xlsx");
  $("csv").onclick = () => download("csv");
  $("clear").onclick = () => {
    for (const item of items) URL.revokeObjectURL(item.thumb);
    items = []; summary = null; queued = done = 0; queue.length = 0; generation += 1;
    $("file-errors").replaceChildren();
    $("progress").hidden = true;
    render();
  };

  (async () => {
    applyLang();
    labels = await (await fetch("/api/labels")).json();
    model = (await (await fetch("/healthz")).json()).model;
    applyLang();
  })();
</script>
</body>
</html>
