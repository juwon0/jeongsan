[project]
name = "jeongsan"
version = "0.1.0"
description = "Snap your receipts, a local open-weight model does the expense report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette 1.x asks for httpx2 in its test client; plain httpx still works.
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]
